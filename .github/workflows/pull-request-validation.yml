name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Parse every Python file
        run: python tools/validate_pr.py --syntax-only

  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Check formatting of changed Python files
        env:
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/validate_pr.py --format-only

  tests:
    name: Complete test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run all tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -v
